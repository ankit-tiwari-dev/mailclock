name: mailclock
# Local development: `docker compose up -d db`, then `npm run dev`.
# Full self-host:    `docker compose --profile app up -d --build`
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailclock
      POSTGRES_PASSWORD: mailclock
      POSTGRES_DB: mailclock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailclock"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
