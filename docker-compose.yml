name: mailclock

# Local development: `docker compose up -d db`, then `npm run dev`.
# Full self-host:    `docker compose --profile app up -d --build`
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailclock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailclock}
      POSTGRES_DB: mailclock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailclock"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [app]
    build: { context: ., target: migrate }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mailclock:${POSTGRES_PASSWORD:-mailclock}@db:5432/mailclock
    depends_on:
      db: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mailclock:${POSTGRES_PASSWORD:-mailclock}@db:5432/mailclock
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    profiles: [app]
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mailclock:${POSTGRES_PASSWORD:-mailclock}@db:5432/mailclock
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
