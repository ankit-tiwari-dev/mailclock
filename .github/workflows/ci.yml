name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mailclock
          POSTGRES_PASSWORD: mailclock
          POSTGRES_DB: mailclock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mailclock" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://mailclock:mailclock@localhost:5432/mailclock_test
      TEST_DATABASE_URL: postgresql://mailclock:mailclock@localhost:5432/mailclock_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm test
      - name: Build web
        run: npm run build --workspace @mailclock/web
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-0000000000000000
          MAILCLOCK_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
